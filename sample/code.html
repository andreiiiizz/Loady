<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loady Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                      "inverse-primary": "#842bd2",
                      "surface-container-highest": "#32343f",
                      "on-secondary-fixed-variant": "#85145a",
                      "primary-container": "#b76dff",
                      "secondary-fixed": "#ffd8e7",
                      "on-primary-fixed-variant": "#6900b3",
                      "on-primary": "#490080",
                      "glass-border": "rgba(255, 255, 255, 0.08)",
                      "on-tertiary": "#003919",
                      "on-secondary-container": "#ff93c8",
                      "tertiary-container": "#00a755",
                      "glass-surface": "rgba(255, 255, 255, 0.03)",
                      "surface-container-low": "#181b25",
                      "on-secondary-fixed": "#3d0026",
                      "on-error-container": "#ffdad6",
                      "surface-bright": "#363943",
                      "surface-container-high": "#272a33",
                      "secondary": "#ffafd3",
                      "error-container": "#93000a",
                      "tertiary-fixed-dim": "#4de082",
                      "inverse-on-surface": "#2d303a",
                      "on-tertiary-container": "#003115",
                      "on-primary-container": "#400071",
                      "tertiary-fixed": "#6dfe9c",
                      "surface-container": "#1c1f29",
                      "on-tertiary-fixed": "#00210c",
                      "primary": "#ddb7ff",
                      "inverse-surface": "#e0e2ef",
                      "on-tertiary-fixed-variant": "#005227",
                      "primary-fixed": "#f0dbff",

                      "surface-variant": "#32343f",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",

                      "full": "9999px"

              "spacing": {

                      "sm": "12px",
                      "lg": "24px",
                      "xl": "32px",

          },

<style>
          .glass-panel {
              background-color: rgba(255, 255, 255, 0.03);
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
              border: 1px solid rgba(255, 255, 255, 0.1);
          }
          .glow-active {
              box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
          }
          .glow-success {
              box-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
          }
          .text-gradient-purple {
              background: linear-gradient(to right, #ddb7ff, #A855F7);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
          }
      </style>
</head>
<body class="bg-background text-on-surface font-body-lg min-h-screen pb-24 selection:bg-electric-purple/30">
<!-- TopAppBar -->
<header class="bg-glass-surface backdrop-blur-xl border-b border-glass-border shadow-none flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full z-50 fixed top-0">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">bolt</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md text-electric-purple tracking-tighter">Loady</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<main class="pt-24 px-margin-mobile md:px-margin-desktop max-w-[1200px] mx-auto flex flex-col gap-xl">
<!-- Hero Status Card -->
<section class="glass-panel rounded-3xl p-lg flex flex-col items-center justify-center text-center glow-active relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-electric-purple/5 to-transparent z-0"></div>
<div class="z-10 w-full flex flex-col items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-sm uppercase tracking-widest">Active Promo Expires In</span>
<!-- Signal Bar Countdown -->
<div class="flex gap-xs mb-lg h-6 w-full max-w-[200px]">
<div class="flex-1 rounded-full bg-neon-lime glow-success"></div>
<div class="flex-1 rounded-full bg-neon-lime glow-success opacity-80"></div>
<div class="flex-1 rounded-full bg-neon-lime glow-success opacity-60"></div>
<div class="flex-1 rounded-full bg-surface-container-highest"></div>
<div class="flex-1 rounded-full bg-surface-container-highest"></div>
</div>
<h2 class="font-data-mono text-display-lg-mobile md:text-display-lg text-white font-medium tracking-tight mb-md">2d 04h 12m</h2>
<div class="inline-flex items-center gap-xs px-md py-xs rounded-full bg-surface-container-highest/50 border border-glass-border">
<span class="material-symbols-outlined text-[16px] text-tertiary">check_circle</span>
<span class="font-body-sm text-body-sm text-tertiary">All systems operational</span>
</div>
</div>
</section>
<!-- Current Promo Details (Glassmorphism) -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="glass-panel rounded-3xl p-lg flex flex-col justify-between">
<div>
<div class="flex justify-between items-start mb-md">
<span class="font-headline-md text-headline-md-mobile text-white">GigaSurf 99</span>
<span class="material-symbols-outlined text-electric-purple text-3xl">wifi_tethering</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-lg">High-speed data allocation for your digital needs.</p>
</div>
<div class="space-y-sm">
<div class="flex justify-between font-data-mono text-data-mono text-sm">
<span class="text-on-surface-variant">Data Left</span>
<span class="text-white">1.2 GB / 2.0 GB</span>
</div>
<!-- Glow Track Progress Bar -->
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-[60%] bg-gradient-to-r from-electric-purple to-primary rounded-full box-shadow-glow"></div>
</div>
</div>
</div>
<div class="glass-panel rounded-3xl p-lg flex flex-col justify-between">
<div>
<div class="flex justify-between items-start mb-md">
<span class="font-headline-md text-headline-md-mobile text-white">Unli Call &amp; Text</span>
<span class="material-symbols-outlined text-secondary text-3xl">forum</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-lg">Unlimited communication to all networks.</p>
</div>
<div class="space-y-sm">
<div class="flex justify-between font-data-mono text-data-mono text-sm">
<span class="text-on-surface-variant">Status</span>
<span class="text-cyber-pink animate-pulse">Expiring Soon</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-[95%] bg-gradient-to-r from-cyber-pink to-secondary rounded-full"></div>
</div>
</div>
</div>
</section>
<!-- Quick Actions -->
<section class="grid grid-cols-2 gap-md">
<button class="bg-gradient-to-br from-primary-container to-electric-purple text-on-primary-container rounded-3xl p-md flex flex-col items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all glow-active h-32">
<span class="material-symbols-outlined text-3xl">account_balance_wallet</span>
<span class="font-body-lg text-body-lg font-semibold">Buy Load</span>
</button>
<button class="glass-panel rounded-3xl p-md flex flex-col items-center justify-center gap-sm hover:bg-white/5 active:scale-95 transition-all h-32">
<span class="material-symbols-outlined text-3xl text-primary">local_activity</span>
<span class="font-body-lg text-body-lg font-semibold text-primary">Promos</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-glass-surface backdrop-blur-lg border border-glass-border shadow-[0_0_20px_rgba(168,85,247,0.3)] fixed bottom-lg left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-md rounded-full z-50 flex justify-around items-center p-xs">
<button class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-12 h-12 shadow-[0_0_15px_rgba(168,85,247,0.5)] active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-white/5 rounded-full active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">map</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-white/5 rounded-full active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">directions_car</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-white/5 rounded-full active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined">person</span>
</button>
</nav>
<!-- Desktop Side Nav Spacer (Conceptual for md+) -->
<div class="hidden md:flex fixed bottom-lg right-lg">
<button class="bg-gradient-to-br from-primary-container to-electric-purple text-on-primary-container rounded-full w-16 h-16 flex items-center justify-center shadow-[0_0_20px_rgba(168,85,247,0.5)] hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
</body></html>
